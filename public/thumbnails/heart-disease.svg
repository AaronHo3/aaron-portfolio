<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">Logistic regression AUC: 0.879 under pooled cross-validation versus 0.802 inside a held-out hospital</title>
  <rect width="800" height="450" fill="#f1ebe6"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#202723">
    <text x="48" y="70" font-size="22" font-weight="700" fill="#5a3d33">AUC, logistic regression (0.5 = chance)</text>
    <line x1="48" y1="380" x2="752" y2="380" stroke="#9c8f88" stroke-width="2"/>
    <g font-size="18" fill="#5f534d" text-anchor="middle">
      <text x="48" y="410" text-anchor="start">0.5</text><text x="400" y="410">0.75</text><text x="752" y="410" text-anchor="end">1.0</text>
    </g>
    <text x="48" y="150" font-size="24" font-weight="700">Pooled cross-validation</text>
    <rect x="48" y="166" width="534" height="46" fill="#8c6f62"/>
    <text x="598" y="200" font-size="30" font-weight="800">0.88</text>
    <text x="48" y="276" font-size="24" font-weight="700">Hospital never seen in training</text>
    <rect x="48" y="292" width="425" height="46" fill="#b4513a"/>
    <text x="489" y="326" font-size="30" font-weight="800">0.80</text>
  </g>
</svg>
