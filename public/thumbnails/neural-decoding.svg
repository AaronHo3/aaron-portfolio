<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="t">
  <title id="t">Character error rate cost when about 17 percent of frame labels change: timing errors minus 0.7 points, identity errors plus 6.8 points</title>
  <rect width="800" height="450" fill="#e7ecf1"/>
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#202723">
    <text x="48" y="70" font-size="22" font-weight="700" fill="#33465c">Cost of label errors on ~17% of frames (best decoder)</text>
    <line x1="350" y1="100" x2="350" y2="380" stroke="#8a97a6" stroke-width="2"/>
    <text x="350" y="410" font-size="18" text-anchor="middle" fill="#4a5866">0</text>
    <text x="740" y="410" font-size="18" text-anchor="end" fill="#4a5866">+8 pp CER</text>
    <text x="48" y="178" font-size="26" font-weight="700">Timing errors</text>
    <text x="48" y="208" font-size="19" fill="#4a5866">right character, wrong time</text>
    <rect x="316" y="165" width="34" height="44" fill="#7a8ea3"/>
    <text x="366" y="198" font-size="30" font-weight="800" fill="#33465c">−0.7 pp</text>
    <text x="48" y="303" font-size="26" font-weight="700">Identity errors</text>
    <text x="48" y="333" font-size="19" fill="#4a5866">right time, wrong character</text>
    <rect x="350" y="290" width="332" height="44" fill="#b4513a"/>
    <text x="668" y="323" font-size="30" font-weight="800" fill="#ffffff" text-anchor="end">+6.8 pp</text>
  </g>
</svg>
