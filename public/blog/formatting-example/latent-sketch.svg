<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="t">
  <title id="t">Encoder maps x to a latent z, decoder maps z back to x-hat</title>
  <rect width="640" height="220" rx="16" fill="#111b32"/>
  <g font-family="Figtree, system-ui, sans-serif" font-size="18" font-weight="700" fill="#eaf1fb" text-anchor="middle">
    <rect x="30" y="80" width="120" height="60" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="116">x</text>
    <path d="M150 110 L250 110" stroke="#a8b6cc" stroke-width="2" marker-end="url(#a)"/>
    <text x="200" y="96" font-size="14" fill="#a8b6cc">encoder</text>
    <circle cx="320" cy="110" r="44" fill="none" stroke="#6366f1" stroke-width="2"/>
    <text x="320" y="116">z</text>
    <path d="M364 110 L470 110" stroke="#a8b6cc" stroke-width="2" marker-end="url(#a)"/>
    <text x="417" y="96" font-size="14" fill="#a8b6cc">decoder</text>
    <rect x="490" y="80" width="120" height="60" rx="12" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="550" y="116">x̂</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a8b6cc"/>
    </marker>
  </defs>
</svg>
