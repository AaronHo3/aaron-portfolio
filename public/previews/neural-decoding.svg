<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1130"/>
      <stop offset="1" stop-color="#0a0e20"/>
    </linearGradient>
    <radialGradient id="glowV1" cx="14%" cy="10%" r="46%">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV2" cx="86%" cy="90%" r="46%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softN" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02040d" flood-opacity="0.55"/>
    </filter>
    <filter id="glowLine" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#fb7185" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgN)"/>
  <rect width="1600" height="900" fill="url(#glowV1)"/>
  <rect width="1600" height="900" fill="url(#glowV2)"/>

  <!-- Title -->
  <text x="100" y="128" fill="#eaf1fb" font-size="50" font-weight="800" letter-spacing="-1.5">Neural Decoding</text>
  <text x="102" y="176" fill="#aeb6d6" font-size="26" font-weight="600">Brain-to-text decoders train on alignment labels nobody ever observed</text>
  <text x="102" y="216" fill="#6f7ba8" font-size="21" font-weight="500">So which kind of labelling mistake actually costs accuracy?</text>

  <!-- ===== LEFT: the two ways forced alignment fails ===== -->
  <g filter="url(#softN)">
    <rect x="100" y="272" width="690" height="372" rx="22" fill="#121738" stroke="#818cf8" stroke-opacity="0.28"/>
  </g>
  <text x="132" y="314" fill="#c9d2ee" font-size="21" font-weight="700">Two ways forced alignment fails</text>

  <text x="132" y="360" fill="#7d88b4" font-size="15" font-weight="600">REFERENCE LABELS</text>
  <g>
    <rect x="132" y="372" width="78" height="34" rx="5" fill="#818cf8"/>
    <rect x="212" y="372" width="78" height="34" rx="5" fill="#22d3ee"/>
    <rect x="292" y="372" width="78" height="34" rx="5" fill="#a78bfa"/>
    <rect x="372" y="372" width="78" height="34" rx="5" fill="#38bdf8"/>
    <rect x="452" y="372" width="78" height="34" rx="5" fill="#818cf8"/>
    <rect x="532" y="372" width="78" height="34" rx="5" fill="#22d3ee"/>
    <rect x="612" y="372" width="78" height="34" rx="5" fill="#a78bfa"/>
  </g>

  <text x="132" y="452" fill="#7d88b4" font-size="15" font-weight="600">BOUNDARY JITTER  ·  right characters, wrong times</text>
  <g>
    <rect x="132" y="464" width="96" height="34" rx="5" fill="#818cf8"/>
    <rect x="230" y="464" width="58" height="34" rx="5" fill="#22d3ee"/>
    <rect x="290" y="464" width="92" height="34" rx="5" fill="#a78bfa"/>
    <rect x="384" y="464" width="62" height="34" rx="5" fill="#38bdf8"/>
    <rect x="448" y="464" width="88" height="34" rx="5" fill="#818cf8"/>
    <rect x="538" y="464" width="64" height="34" rx="5" fill="#22d3ee"/>
    <rect x="604" y="464" width="86" height="34" rx="5" fill="#a78bfa"/>
  </g>
  <text x="704" y="488" fill="#4ade80" font-size="18" font-weight="800">free</text>

  <text x="132" y="544" fill="#7d88b4" font-size="15" font-weight="600">IDENTITY CORRUPTION  ·  right times, wrong characters</text>
  <g>
    <rect x="132" y="556" width="78" height="34" rx="5" fill="#818cf8"/>
    <rect x="212" y="556" width="78" height="34" rx="5" fill="#fb7185"/>
    <rect x="292" y="556" width="78" height="34" rx="5" fill="#a78bfa"/>
    <rect x="372" y="556" width="78" height="34" rx="5" fill="#38bdf8"/>
    <rect x="452" y="556" width="78" height="34" rx="5" fill="#fb7185"/>
    <rect x="532" y="556" width="78" height="34" rx="5" fill="#22d3ee"/>
    <rect x="612" y="556" width="78" height="34" rx="5" fill="#fb7185"/>
  </g>
  <text x="704" y="580" fill="#fb7185" font-size="18" font-weight="800">costly</text>

  <text x="132" y="622" fill="#6f7ba8" font-size="16" font-weight="500">Injected in controlled amounts, then measured.</text>

  <!-- ===== RIGHT: the dose-response result ===== -->
  <g filter="url(#softN)">
    <rect x="830" y="272" width="670" height="372" rx="22" fill="#121738" stroke="#22d3ee" stroke-opacity="0.24"/>
  </g>
  <text x="862" y="314" fill="#c9d2ee" font-size="21" font-weight="700">Decoding cost vs. label damage</text>

  <line x1="900" y1="600" x2="1460" y2="600" stroke="#3a4470" stroke-width="2"/>
  <line x1="900" y1="345" x2="900" y2="600" stroke="#3a4470" stroke-width="2"/>
  <line x1="900" y1="565" x2="1460" y2="565" stroke="#4b5680" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="866" y="570" fill="#6f7ba8" font-size="14" font-weight="600">0</text>
  <text x="848" y="360" fill="#6f7ba8" font-size="14" font-weight="600">+18</text>
  <text x="836" y="626" fill="#6f7ba8" font-size="14" font-weight="600">0%</text>
  <text x="1420" y="626" fill="#6f7ba8" font-size="14" font-weight="600">40%</text>
  <text x="1024" y="650" fill="#7d88b4" font-size="15" font-weight="600">share of frame labels changed</text>
  <text x="820" y="480" fill="#7d88b4" font-size="15" font-weight="600" transform="rotate(-90 820 480)">CER cost (pp)</text>

  <polyline points="920,565 985,530 1050,507 1180,480 1440,351"
            fill="none" stroke="#fb7185" stroke-width="4.5" stroke-linecap="round"
            stroke-linejoin="round" filter="url(#glowLine)"/>
  <g fill="#fb7185">
    <circle cx="920" cy="565" r="6"/><circle cx="985" cy="530" r="6"/>
    <circle cx="1050" cy="507" r="6"/><circle cx="1180" cy="480" r="6"/>
    <circle cx="1440" cy="351" r="7"/>
  </g>
  <text x="1318" y="336" fill="#fb7185" font-size="17" font-weight="800">+17.1 pp</text>

  <polyline points="920,565 972,578 1024,574 1141,574 1323,476"
            fill="none" stroke="#22d3ee" stroke-width="4.5" stroke-linecap="round"
            stroke-linejoin="round"/>
  <g fill="#22d3ee">
    <circle cx="920" cy="565" r="6"/><circle cx="972" cy="578" r="6"/>
    <circle cx="1024" cy="574" r="6"/><circle cx="1141" cy="574" r="6"/>
    <circle cx="1323" cy="476" r="7"/>
  </g>
  <text x="982" y="606" fill="#22d3ee" font-size="16" font-weight="700">flat to 17% of frames</text>

  <g>
    <rect x="1148" y="292" width="14" height="5" rx="2.5" fill="#fb7185"/>
    <text x="1170" y="298" fill="#c9d2ee" font-size="15" font-weight="600">identity</text>
    <rect x="1252" y="292" width="14" height="5" rx="2.5" fill="#22d3ee"/>
    <text x="1274" y="298" fill="#c9d2ee" font-size="15" font-weight="600">timing</text>
  </g>

  <!-- ===== BOTTOM: the finding ===== -->
  <g filter="url(#softN)">
    <rect x="100" y="686" width="1400" height="118" rx="20" fill="#141a3d" stroke="#818cf8" stroke-opacity="0.22"/>
  </g>
  <text x="140" y="738" fill="#eaf1fb" font-size="30" font-weight="800" letter-spacing="-0.6">A forced aligner does not need to be temporally precise. It needs to be identity-correct.</text>
  <text x="140" y="778" fill="#8b95bd" font-size="19" font-weight="500">Identity errors cost 2.4x to 10.8x what timing errors cost  ·  pre-registered hypothesis refuted and inverted  ·  198 runs, 0 failures</text>

  <text x="100" y="856" fill="#5b6592" font-size="17" font-weight="500">Willett et al. (2021) intracortical handwriting data  ·  GRU, RCNN and Conformer decoders  ·  every number traced to a committed artifact</text>
</svg>
