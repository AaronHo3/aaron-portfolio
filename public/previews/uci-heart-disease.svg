<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#080e20"/>
    </linearGradient>
    <linearGradient id="accH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glowH1" cx="14%" cy="10%" r="46%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowH2" cx="86%" cy="90%" r="46%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="softH" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02040d" flood-opacity="0.55"/>
    </filter>
    <filter id="glowPillH" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowH" markerWidth="14" markerHeight="14" refX="7" refY="6" orient="auto">
      <path d="M0,0 L11,6 L0,12 Z" fill="#5aa6f0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bgH)"/>
  <rect width="1600" height="900" fill="url(#glowH1)"/>
  <rect width="1600" height="900" fill="url(#glowH2)"/>

  <!-- Title -->
  <text x="110" y="152" fill="#eaf1fb" font-size="54" font-weight="800" letter-spacing="-1.5">Heart Disease &#183; Multi-Site Clinical ML</text>
  <text x="112" y="200" fill="#aeb6d6" font-size="27" font-weight="600">Leave-one-hospital-out external validation across 4 cohorts</text>

  <!-- ===== ZONE A: 4 cohorts ===== -->
  <text x="134" y="296" fill="#aeb6d6" font-size="18" font-weight="700">4 hospital cohorts</text>
  <g filter="url(#softH)">
    <rect x="110" y="312" width="360" height="288" rx="22" fill="#101736" stroke="#38bdf8" stroke-opacity="0.28"/>
  </g>
  <!-- three "train" cohorts -->
  <g>
    <rect x="134" y="334" width="312" height="52" rx="13" fill="url(#accH)"/>
    <text x="152" y="367" fill="#ffffff" font-size="20" font-weight="800">Cleveland</text>
    <text x="430" y="367" text-anchor="end" fill="#dbeafe" font-size="16" font-weight="700">train</text>
  </g>
  <g>
    <rect x="134" y="396" width="312" height="52" rx="13" fill="url(#accH)"/>
    <text x="152" y="429" fill="#ffffff" font-size="20" font-weight="800">Hungary</text>
    <text x="430" y="429" text-anchor="end" fill="#dbeafe" font-size="16" font-weight="700">train</text>
  </g>
  <g>
    <rect x="134" y="458" width="312" height="52" rx="13" fill="url(#accH)"/>
    <text x="152" y="491" fill="#ffffff" font-size="20" font-weight="800">VA</text>
    <text x="430" y="491" text-anchor="end" fill="#dbeafe" font-size="16" font-weight="700">train</text>
  </g>
  <!-- held-out cohort -->
  <g>
    <rect x="134" y="520" width="312" height="56" rx="13" fill="#0e2438" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="152" y="555" fill="#7dd3fc" font-size="20" font-weight="800">Switzerland</text>
    <text x="430" y="555" text-anchor="end" fill="#22d3ee" font-size="16" font-weight="800">held out</text>
  </g>

  <!-- arrow A -> B -->
  <line x1="494" y1="456" x2="540" y2="456" stroke="#5aa6f0" stroke-width="3" marker-end="url(#arrowH)"/>

  <!-- ===== ZONE B: calibrated models + rigor ===== -->
  <g filter="url(#softH)">
    <rect x="556" y="312" width="402" height="288" rx="22" fill="#101736" stroke="#818cf8" stroke-opacity="0.28"/>
  </g>
  <text x="580" y="350" fill="#aeb6d6" font-size="18" font-weight="700">Calibrated models &#183; nested CV</text>
  <g>
    <rect x="580" y="368" width="354" height="46" rx="12" fill="#141a3a" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="600" y="398" fill="#c7cdec" font-size="18" font-weight="800">Logistic Regression</text>
  </g>
  <g>
    <rect x="580" y="424" width="354" height="46" rx="12" fill="#141a3a" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="600" y="454" fill="#c7cdec" font-size="18" font-weight="800">Random Forest</text>
  </g>
  <g>
    <rect x="580" y="480" width="354" height="46" rx="12" fill="#141a3a" stroke="#818cf8" stroke-opacity="0.3"/>
    <text x="600" y="510" fill="#c7cdec" font-size="18" font-weight="800">Gradient Boosting</text>
  </g>
  <text x="580" y="560" fill="#7e87ad" font-size="16" font-weight="600">bootstrap 95% CIs &#183; DeLong test &#183; SHAP</text>

  <!-- arrow B -> C -->
  <line x1="962" y1="456" x2="1008" y2="456" stroke="#5aa6f0" stroke-width="3" marker-end="url(#arrowH)"/>

  <!-- ===== ZONE C: evaluation ===== -->
  <g filter="url(#softH)">
    <rect x="1024" y="312" width="466" height="288" rx="22" fill="#101736" stroke="#22d3ee" stroke-opacity="0.26"/>
  </g>
  <text x="1048" y="348" fill="#aeb6d6" font-size="18" font-weight="700">Calibration &#183; decision curve</text>
  <!-- reliability plot -->
  <g>
    <rect x="1048" y="362" width="190" height="124" rx="10" fill="#0c1430" stroke="#22d3ee" stroke-opacity="0.25"/>
    <!-- ideal diagonal -->
    <line x1="1058" y1="476" x2="1228" y2="372" stroke="#475569" stroke-width="2" stroke-dasharray="5 5"/>
    <!-- calibration curve -->
    <polyline fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      points="1058,474 1090,452 1122,432 1158,412 1196,392 1228,378"/>
    <text x="1143" y="506" text-anchor="middle" fill="#7e87ad" font-size="14" font-weight="700">reliability</text>
  </g>
  <!-- net benefit plot -->
  <g>
    <rect x="1256" y="362" width="210" height="124" rx="10" fill="#0c1430" stroke="#22d3ee" stroke-opacity="0.25"/>
    <line x1="1266" y1="476" x2="1456" y2="476" stroke="#475569" stroke-width="2"/>
    <polyline fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
      points="1266,384 1306,392 1346,410 1390,440 1430,470 1456,476"/>
    <polyline fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5"
      points="1266,446 1456,474"/>
    <text x="1361" y="506" text-anchor="middle" fill="#7e87ad" font-size="14" font-weight="700">net benefit (DCA)</text>
  </g>

  <!-- result chip -->
  <g filter="url(#glowPillH)">
    <rect x="1048" y="540" width="418" height="44" rx="13" fill="#10243a" stroke="#22d3ee" stroke-opacity="0.4"/>
  </g>
  <text x="1257" y="568" text-anchor="middle" fill="#e7ecff" font-size="21" font-weight="800">Pooled 0.88 &#8594; LOSO 0.79</text>

  <!-- Footer caption -->
  <text x="800" y="672" text-anchor="middle" fill="#7e87ad" font-size="23" font-weight="600">Does the model hold up across hospitals &#8212; and help real decisions?</text>
</svg>
